apply plugin: 'com.android.application'

android {
    namespace = 'com.genymobile.scrcpy'
    compileSdk 31
    defaultConfig {
        applicationId = "com.genymobile.scrcpy"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 40100
        versionName "4.1"
        testInstrumentationRunner = "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    buildFeatures {
        buildConfig = true
        aidl = true
    }
    lint {
        disable 'UseRequiresApi'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
}

apply from: "$project.rootDir/config/android-checkstyle.gradle"

// Reject stale JNI binaries at packaging; tests and lint do not need native builds.
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('NativeLibs')) {
        task.doFirst {
            def manifestFile = file('native-build.json')
            if (!manifestFile.exists()) {
                throw new GradleException('Rebuild JNI first: python3 server/tools/build_native.py; see docs/streaming-fixes.md')
            }
            def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
            def requiredFiles = fileTree('src/main/cpp') { include '*.cc', '*.h' }.files
            requiredFiles += file('src/main/jniLibs/arm64-v8a/libscrcpy_native.so')
            requiredFiles += file('src/main/java/com/genymobile/scrcpy/device/NativeEncoderBridge.java')
            requiredFiles.each { source ->
                def relative = rootProject.projectDir.toPath().relativize(source.toPath()).toString()
                def digest = source.exists() ? java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString() : ''
                if (manifest.files[relative] != digest) {
                    throw new GradleException('Stale native library: rebuild JNI before packaging (' + relative + ')')
                }
            }
        }
    }
}

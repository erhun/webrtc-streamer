apply plugin: 'com.android.application'

android {
    namespace = 'com.genymobile.scrcpy'
    compileSdk 31
    defaultConfig {
        applicationId = "com.genymobile.scrcpy"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 40100
        versionName "4.1"
        testInstrumentationRunner = "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    buildFeatures {
        buildConfig = true
        aidl = true
    }
    lint {
        disable 'UseRequiresApi'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
}

apply from: "$project.rootDir/config/android-checkstyle.gradle"

// Resolve project APIs during configuration, never inside the cached task action.
def nativeManifestFile = layout.projectDirectory.file('native-build.json').asFile
def nativeRepositoryDir = rootProject.layout.projectDirectory.asFile
def nativeVerificationFiles = files(
        fileTree('src/main/cpp') { include '*.cc', '*.h' },
        'src/main/jniLibs/arm64-v8a/libscrcpy_native.so',
        'src/main/java/com/genymobile/scrcpy/device/NativeEncoderBridge.java',
        'tools/build_native.py')

// Packaging depends on verified JNI. Tests/lint do not require a native toolchain.
// Only verifies prebuilt artifacts from the native build server; never compiles or downloads JNI.
def prepareNativeLibrary = tasks.register('prepareNativeLibrary', Exec) {
    workingDir nativeRepositoryDir
    commandLine 'python3', new File(nativeRepositoryDir, 'server/tools/prepare_native.py').absolutePath, '--check'
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('NativeLibs')) {
        task.dependsOn(prepareNativeLibrary)
        task.inputs.file(nativeManifestFile).withPropertyName('nativeManifest')
        task.inputs.files(nativeVerificationFiles).withPropertyName('nativeSourcesAndLibrary')
        // Check again at the packaging boundary so edits after prepare cannot admit a stale .so.
        task.doFirst {
            def manifestFile = nativeManifestFile
            if (!manifestFile.exists()) {
                throw new GradleException('JNI manifest missing after preparation; see docs/native-build.md')
            }
            def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
            nativeVerificationFiles.files.each { source ->
                def relative = nativeRepositoryDir.toPath().relativize(source.toPath()).toString()
                def digest = source.exists() ? java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString() : ''
                if (!digest || manifest.files[relative] != digest) {
                    throw new GradleException('Native input changed after preparation: ' + relative + '; rerun the build')
                }
            }
        }
    }
}
